---
layout: blog-layout
---

<div class="post-container">
    <div class="post-header">
        {% if page.image %}
            <img src="{{ page.image.path }}" alt="{{ page.image.alt }}">
        {% endif %}
        <h1>{{ page.title }}</h1>
        <p>{{ page.description }}</p>
        <p><i class="fa-regular fa-calendar" style="margin-right: 8px;"></i>{{ page.date | date_to_string }}</p>
    </div>

    <div class="post-body">
    {{ content }}
    </div>
</div>
